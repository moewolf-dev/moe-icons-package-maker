name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run ui:build
      # The reconcile check cross-validates the catalog against the official
      # SVG source directory in moe-icons-code-library, which is a separate
      # repository. Check it out read-only into the path the script expects so
      # the check runs on real source files instead of failing on a missing dir.
      - uses: actions/checkout@v4
        with:
          repository: moewolf-dev/moe-icons-code-library
          ref: branch-1017-key
          path: ../moe-icons-code-library
      - run: npx vite-node src/catalog/reconcile.ts data/icon-catalog.json ../moe-icons-code-library/icons
