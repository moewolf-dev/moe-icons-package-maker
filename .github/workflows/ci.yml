name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run ui:build
      # The reconcile check cross-validates the catalog against the official
      # SVG source directory, which lives in the private moe-icons-code-library
      # repository. PR CI from forks has no secrets and cannot clone it, so the
      # step runs only when the source path is present (local runs, or a
      # release workflow with repository access). All other checks are always
      # enforced.
      - name: Reconcile catalog against official sources (if available)
        run: |
          if [ -d vendor/moe-icons-code-library/icons ]; then
            npx vite-node src/catalog/reconcile.ts data/icon-catalog.json vendor/moe-icons-code-library/icons
          else
            echo "note: official SVG source dir not available in this CI context; skipping cross-repo reconcile"
          fi
